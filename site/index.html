<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar · Cavalaria | Oeste Roleplay</title>
  <link rel="icon" href="logo-oeste.png">
  <link rel="preload" as="image" href="assets/login-scenery.webp" fetchpriority="high">
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
  <main class="paper login-card" aria-labelledby="loginTitle">
    <span class="login-seal login-seal-top" aria-hidden="true">★</span>
    <div class="eyebrow">Território do Oeste · Ordem e Justiça</div>
    <img class="badge-star server-logo" src="logo-oeste.png" alt="Logo Oeste Roleplay">
    <h1 id="loginTitle">Cavalaria</h1>
    <div class="subtitle">Registro Geral · Alto Comando</div>
    <div class="rule" aria-hidden="true">★</div>

    <div id="message" class="system-msg hide" role="status" aria-live="polite" aria-atomic="true"></div>

    <form id="loginForm" class="hide">
      <div class="field">
        <label for="loginUser">Usuário ou e-mail</label>
        <span class="login-input">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg>
          <input id="loginUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus placeholder="Digite seu usuário ou e-mail">
        </span>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <span class="login-input">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="1"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v3"/></svg>
          <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Digite sua senha">
          <button id="togglePassword" class="password-toggle" type="button" aria-label="Mostrar senha" aria-controls="password" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
          </button>
        </span>
      </div>
      <button class="btn login-submit" type="submit"><span>Entrar no registro</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    </form>

    <div class="rule login-footer-rule" aria-hidden="true">★</div>
    <p class="footnote">Cada oficial tem a própria conta, criada pelo Alto Comando.<br>Não compartilhe sua senha: as alterações ficam registradas no seu nome.</p>
    <noscript><p class="system-msg error">Ative o JavaScript do navegador para acessar o registro.</p></noscript>
    <span class="login-seal login-seal-bottom" aria-hidden="true">★</span>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="comum.js"></script>
  <script src="login.js"></script>
  <script src="login-ui.js"></script>
</body>
</html>
